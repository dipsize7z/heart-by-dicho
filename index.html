<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heart</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { 
      display: block; 
      touch-action: none; /* отключаем зум/скролл на мобилках */
    }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Формула сердечка
  function heartShape(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return new THREE.Vector3(x, y, 0);
  }

  // Точки
  const particlesCount = 2000;
  const positions = new Float32Array(particlesCount * 3);
  const targetPositions = new Float32Array(particlesCount * 3);

  for (let i = 0; i < particlesCount; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartShape(t);

    positions[i * 3]     = (Math.random() - 0.5) * 80;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 80;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 80;

    targetPositions[i * 3]     = p.x;
    targetPositions[i * 3 + 1] = p.y;
    targetPositions[i * 3 + 2] = p.z;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: 0xee52b2,
    size: 0.2,
    blending: THREE.AdditiveBlending,
    transparent: true
  });

  const particles = new THREE.Points(geometry, material);
  scene.add(particles);

  camera.position.z = 40;

  let inHeart = false;

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // Общая функция переключения
  function triggerAnimation() {
    const positionsAttr = geometry.attributes.position.array;

    if (!inHeart) {
      // хаос -> сердце
      for (let i = 0; i < particlesCount; i++) {
        gsap.to(positionsAttr, {
          duration: 2,
          ease: "power2.inOut",
          [i * 3]:     targetPositions[i * 3],
          [i * 3 + 1]: targetPositions[i * 3 + 1],
          [i * 3 + 2]: targetPositions[i * 3 + 2],
          onUpdate: () => geometry.attributes.position.needsUpdate = true
        });
      }
    } else {
      // сердце -> хаос
      for (let i = 0; i < particlesCount; i++) {
        gsap.to(positionsAttr, {
          duration: 2,
          ease: "power2.inOut",
          [i * 3]:     (Math.random() - 0.5) * 80,
          [i * 3 + 1]: (Math.random() - 0.5) * 80,
          [i * 3 + 2]: (Math.random() - 0.5) * 80,
          onUpdate: () => geometry.attributes.position.needsUpdate = true
        });
      }
    }

    inHeart = !inHeart;
  }

  // Слушаем события на canvas
  const canvas = renderer.domElement;

  canvas.addEventListener("click", triggerAnimation);

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault(); // чтобы не скроллило
    triggerAnimation();
  }, { passive: false });

  // Адаптация под размеры окна
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
